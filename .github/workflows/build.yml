name: Build APK
on:
  push: { branches: [ main ] }
  workflow_dispatch:
    inputs:
      build_release: { type: boolean, default: false }

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }

      - uses: gradle/actions/setup-gradle@v4

      - name: Debug build
        id: debug_build
        run: ./gradlew assembleDebug --stacktrace 2>&1 | tee build_log.txt

      - name: Publish failure log for debugging
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tail -c 60000 build_log.txt > build_log_tail.txt
          BODY=$(python3 -c "
import json
with open('build_log_tail.txt') as f:
    content = f.read()
print(json.dumps({'body': '\`\`\`\n' + content + '\n\`\`\`'}))
")
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues" \
            -d "{\"title\": \"CI build failure log ${{ github.run_id }}\", \"body\": \"see next comment\"}" > issue.json
          ISSUE_NUM=$(python3 -c "import json;print(json.load(open('issue.json'))['number'])")
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/$ISSUE_NUM/comments" \
            -d "$BODY"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Release build
        if: ${{ github.event.inputs.build_release == 'true' }}
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.keystore
          ./gradlew assembleRelease --stacktrace \
            -Pandroid.injected.signing.store.file=$(pwd)/release.keystore \
            -Pandroid.injected.signing.store.password="$RELEASE_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$RELEASE_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$RELEASE_KEY_PASSWORD"

      - uses: actions/upload-artifact@v4
        if: ${{ github.event.inputs.build_release == 'true' }}
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
