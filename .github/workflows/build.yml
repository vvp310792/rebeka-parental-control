name: Build APK
on:
  push: { branches: [ main ] }
  workflow_dispatch:
    inputs:
      build_release: { type: boolean, default: false }

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }

      - uses: gradle/actions/setup-gradle@v4

      - name: Debug build
        id: debug_build
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build_log.txt

      - name: Publish build log for debugging
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "--- find outputs ---" >> build_log.txt
          find app/build/outputs -type f >> build_log.txt 2>&1 || true
          { grep -n -B2 -A100 "FAILURE:" build_log.txt || true; echo "---TAIL---"; tail -c 20000 build_log.txt; } > build_log_tail.txt
          jq -n --rawfile content build_log_tail.txt '{title: "CI build log", body: ("```\n" + $content + "\n```")}' > issue_payload.json
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues" \
            -d @issue_payload.json

      - name: Publish debug APK as a GitHub Release (direct download, no zip)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          gh release delete latest-debug --yes --repo ${{ github.repository }} || true
          git push origin :refs/tags/latest-debug || true
          gh release create latest-debug "$APK_PATH" \
            --repo ${{ github.repository }} \
            --title "Debug APK (latest, ${{ github.sha }})" \
            --notes "Автосборка с коммита ${{ github.sha }}" \
            --target ${{ github.sha }}

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Release build
        if: ${{ github.event.inputs.build_release == 'true' }}
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.keystore
          ./gradlew assembleRelease --stacktrace \
            -Pandroid.injected.signing.store.file=$(pwd)/release.keystore \
            -Pandroid.injected.signing.store.password="$RELEASE_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$RELEASE_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$RELEASE_KEY_PASSWORD"

      - uses: actions/upload-artifact@v4
        if: ${{ github.event.inputs.build_release == 'true' }}
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
